name: Deploy

on:
  push:
    # todo: reenable once I know this works
    # branches: [ "master" ]
    paths:
      - backend/**

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_ACCESS_TOKEN }}
