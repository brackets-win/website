name: Deploy

on:
  push:
    branches: [ "master" ]
    paths:
      - backend/**

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: fly deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_ACCESS_TOKEN }}
